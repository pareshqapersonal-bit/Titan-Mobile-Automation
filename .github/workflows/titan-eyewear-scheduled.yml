name: Titan Eyewear Mobile Automation - Scheduled Run

on:
  schedule:
    # GitHub cron is always UTC: 08:00 UTC = 01:30 PM IST (UTC+5:30)
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  # Never let two scheduled runs fight over BrowserStack parallel sessions
  group: titan-eyewear-scheduled
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Flutter App Automation on BrowserStack
        id: tests
        continue-on-error: true
        env:
          EXECUTION_MODE: browserstack
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          TEST_DEFAULT_USER_MOBILE: ${{ secrets.TEST_DEFAULT_USER_MOBILE }}
          TEST_DEFAULT_USER_PASSWORD: ${{ secrets.TEST_DEFAULT_USER_PASSWORD }}
          # Runner is UTC; run the JVM in IST so Extent report timestamps match the run time
          TZ: Asia/Kolkata
        run: mvn clean test -DsuiteXmlFile=testng-cancel-order.xml -Duser.timezone=Asia/Kolkata

      - name: Compute Run Details
        if: always()
        id: meta
        run: |
          echo "run_time=$(TZ=Asia/Kolkata date '+%d-%b-%Y %I:%M %p IST')" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "result=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi

          # Attach this run's Extent report (renamed with the IST run time so it can't be
          # mistaken for an older one) plus failure screenshots. Gmail rejects messages over
          # 25 MB and attachments grow ~37% when encoded, so keep the raw total under 16 MB:
          # report first, then as many screenshots as still fit.
          budget=$((16 * 1024 * 1024))
          used=0
          files=""
          report_note=""
          stamp=$(TZ=Asia/Kolkata date '+%d-%b-%Y_%I-%M-%p')
          if [ -f Reports/ExtentReport_v2.html ]; then
            report="Reports/TitanEyewear_Report_${stamp}.html"
            cp Reports/ExtentReport_v2.html "$report"
            size=$(stat -c %s "$report")
            if [ "$size" -le "$budget" ]; then
              files="$report"
              used=$size
            else
              report_note="The Extent report was too large to email - download it from the run's artifacts."
            fi
          else
            report_note="No Extent report was generated."
          fi
          shot_total=0
          shot_attached=0
          for f in $(ls -t Screenshots/*.jpg Screenshots/*.png 2>/dev/null); do
            shot_total=$((shot_total + 1))
            size=$(stat -c %s "$f")
            if [ $((used + size)) -le "$budget" ]; then
              files="${files:+$files,}$f"
              used=$((used + size))
              shot_attached=$((shot_attached + 1))
            fi
          done
          if [ "$shot_total" -eq 0 ]; then
            shot_note="No failure screenshots were captured."
          elif [ "$shot_attached" -eq "$shot_total" ]; then
            shot_note="${shot_total} failure screenshot(s) attached."
          else
            shot_note="${shot_attached} of ${shot_total} failure screenshot(s) attached (size limit) - the rest are in the run's artifacts."
          fi
          shot_note="${report_note} ${shot_note}"
          echo "attachments=${files}" >> "$GITHUB_OUTPUT"
          echo "shot_note=${shot_note}" >> "$GITHUB_OUTPUT"

          # Passed/failed counts per payment method, plus the list of failed cases
          {
            echo "payment_summary<<SUMMARY_EOF"
            python3 .github/scripts/payment_summary.py target/surefire-reports/testng-results.xml
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-eyewear-reports-${{ github.run_number }}
          path: |
            Reports/
            Screenshots/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Email Report to QA
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # Defaults to Gmail SMTP; add SMTP_SERVER / SMTP_PORT secrets to override
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: ${{ (secrets.SMTP_PORT || '465') == '465' }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: Titan Mobile Automation <${{ secrets.EMAIL_USERNAME }}>
          to: paresh.p@fortune4.in
          subject: "Titan Eyewear Mobile Automation | ${{ steps.meta.outputs.result }} | Run #${{ github.run_number }}"
          html_body: |
            <html>
            <body>
            <h2>Titan Eyewear Mobile Automation - Scheduled Test Execution Report</h2>
            <table border="1" cellpadding="6" cellspacing="0">
              <tr><td><b>Run</b></td><td>#${{ github.run_number }}</td></tr>
              <tr><td><b>Triggered By</b></td><td>${{ github.event_name }}</td></tr>
              <tr><td><b>Executed At</b></td><td>${{ steps.meta.outputs.run_time }}</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Execution Mode</b></td><td>BrowserStack</td></tr>
              <tr><td><b>Test Suite</b></td><td>testng-cancel-order.xml</td></tr>
              <tr><td><b>Result</b></td><td><b>${{ steps.meta.outputs.result }}</b></td></tr>
            </table>
            ${{ steps.meta.outputs.payment_summary }}
            <br>
            <p>The detailed Extent Report of this run is attached to this email.</p>
            <p>${{ steps.meta.outputs.shot_note }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open GitHub Actions Run</a></p>
            </body>
            </html>
          attachments: ${{ steps.meta.outputs.attachments }}

      - name: Mark Job Failed If Tests Failed
        if: always() && steps.tests.outcome != 'success'
        run: |
          echo "Test execution failed - see attached report / uploaded artifacts."
          exit 1
